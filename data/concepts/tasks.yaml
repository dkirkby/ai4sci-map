schema_version: 1
fragment_type: concepts

concepts:
  - id: regression
    label: Regression
    kind: task
    audience_level: 4
    description: Predicting one or more continuous numerical values.

  - id: classification
    label: Classification
    kind: task
    audience_level: 3
    description: Assigning an input to one or more discrete categories.

  - id: forecasting
    label: Forecasting
    kind: task
    audience_level: 2
    description: Predicting future observations or states from past and current information.

  - id: clustering
    label: Clustering
    kind: task
    audience_level: 4
    description: Grouping observations according to similarity without predefined target labels.

  - id: dimensionality-reduction
    label: Dimensionality reduction
    kind: task
    audience_level: 5
    description: Representing data with fewer variables while preserving selected structure or information.

  - id: density-estimation
    label: Density estimation
    kind: task
    audience_level: 5
    description: Estimating a probability distribution from observed samples.

  - id: anomaly-detection
    label: Anomaly detection
    kind: task
    audience_level: 3
    description: Identifying observations that differ substantially from expected or typical patterns.

  - id: representation-learning
    label: Representation learning
    kind: task
    audience_level: 5
    description: Learning features or latent variables useful for subsequent analysis or prediction.

  - id: sequence-modeling
    label: Sequence modeling
    kind: task
    audience_level: 5
    description: Modeling ordered data in which relationships depend on position or time.

  - id: language-modeling
    label: Language modeling
    kind: task
    audience_level: 4
    description: Assigning probabilities to language sequences or predicting elements of those sequences.

  - id: masked-token-prediction
    label: Masked-token prediction
    kind: task
    audience_level: 5
    description: Predicting tokens hidden from an otherwise visible input sequence.

  - id: next-token-prediction
    label: Next-token prediction
    kind: task
    audience_level: 4
    description: Predicting the next token conditioned on preceding tokens.

  - id: image-generation
    label: Image generation
    kind: task
    audience_level: 2
    description: Producing new images, optionally conditioned on text, images, or other information.

  - id: text-generation
    label: Text generation
    kind: task
    audience_level: 2
    description: Producing sequences of natural-language text.

  - id: machine-translation
    label: Machine translation
    kind: task
    audience_level: 2
    description: Converting content from one human language to another.

  - id: question-answering
    label: Question answering
    kind: task
    audience_level: 3
    description: Producing answers to questions using learned knowledge, supplied context, retrieval, or tools.

  - id: information-retrieval
    label: Information retrieval
    kind: task
    audience_level: 4
    description: Finding and ranking information relevant to a query.

  - id: recommendation
    label: Recommendation
    kind: task
    audience_level: 2
    description: Selecting or ranking items for a user or context.

  - id: control
    label: Control
    kind: task
    audience_level: 4
    description: Selecting actions intended to influence the behavior or state of a system.

  - id: planning
    label: Planning
    kind: task
    audience_level: 4
    description: Constructing a sequence or policy of actions intended to achieve an objective.

  - id: speech-recognition
    label: Speech recognition
    kind: task
    audience_level: 1
    description: Converting spoken audio into written text.
    acronyms:
      - ASR

  - id: facial-recognition
    label: Facial recognition
    kind: task
    audience_level: 1
    description: Identifying or verifying individuals from their facial features in images or video.

  - id: text-to-speech
    label: Text-to-speech
    kind: task
    audience_level: 2
    description: Converting written text into synthesized spoken audio.
    acronyms:
      - TTS

  - id: summarization
    label: Summarization
    kind: task
    audience_level: 2
    description: Producing a shorter version of a text that preserves its most important information.

  - id: code-generation
    label: Code generation
    kind: task
    audience_level: 2
    description: Producing source code from natural-language descriptions or partial code.

  - id: video-generation
    label: Video generation
    kind: task
    audience_level: 2
    description: Producing new video, optionally conditioned on text, images, or other information.

  - id: object-detection
    label: Object detection
    kind: task
    audience_level: 3
    description: Locating and classifying objects within an image or video.

  - id: sentiment-analysis
    label: Sentiment analysis
    kind: task
    audience_level: 3
    description: Determining the emotional tone or opinion expressed in text.

  - id: music-generation
    label: Music generation
    kind: task
    audience_level: 3
    description: Producing new musical audio or compositions, optionally conditioned on text or other input.

  - id: content-moderation
    label: Content moderation
    kind: task
    audience_level: 2
    description: Detecting and filtering content that violates platform policies or safety guidelines, such as harassment, hate speech, or explicit material.

  - id: optical-character-recognition
    label: Optical character recognition
    kind: task
    audience_level: 2
    description: Converting images of printed or handwritten text into machine-readable text.
    acronyms:
      - OCR

  - id: image-classification
    label: Image classification
    kind: task
    audience_level: 3
    description: Assigning an image to one or more predefined categories.

  - id: image-segmentation
    label: Image segmentation
    kind: task
    audience_level: 4
    description: Partitioning an image into regions, typically by assigning a class label to each pixel.

  - id: image-captioning
    label: Image captioning
    kind: task
    audience_level: 3
    description: Generating a natural-language description of an image's content.

  - id: voice-cloning
    label: Voice cloning
    kind: task
    audience_level: 2
    description: Synthesizing speech in a target person's voice from a sample of their recorded speech.

  - id: audio-generation
    label: Audio generation
    kind: task
    audience_level: 3
    description: Producing new audio, such as speech, sound effects, or music, optionally conditioned on text or other input.

  - id: document-understanding
    label: Document understanding
    kind: task
    audience_level: 4
    description: Extracting structure and meaning from documents, such as text, layout, tables, and fields, from formats like scans or PDFs.

  - id: information-extraction
    label: Information extraction
    kind: task
    audience_level: 4
    description: Automatically pulling structured facts, entities, or relationships out of unstructured text or documents.

  - id: vector-search
    label: Vector search
    kind: task
    audience_level: 4
    description: Finding the stored vectors most similar to a query vector, typically by approximate nearest-neighbor search.

  - id: semantic-search
    label: Semantic search
    kind: task
    audience_level: 3
    description: Retrieving results by matching meaning rather than exact keywords, typically using embeddings to represent similarity.

  - id: protein-structure-prediction
    label: Protein structure prediction
    kind: task
    audience_level: 3
    description: Predicting a protein's three-dimensional structure from its amino-acid sequence.

  - id: drug-discovery
    label: Drug discovery
    kind: task
    audience_level: 2
    description: Identifying and optimizing chemical compounds with potential as new medicines.
