schema_version: 1
fragment_type: concepts

concepts:
  - id: prompt
    label: Prompt
    kind: data_concept
    audience_level: 2
    description: Input supplied to a generative or interactive model to specify context, instructions, or desired output.

  - id: prompt-engineering
    label: Prompt engineering
    kind: training_method
    audience_level: 2
    description: Designing and evaluating prompts to elicit desired model behavior without changing the model's main parameters.

  - id: context-window
    label: Context window
    kind: property
    audience_level: 4
    description: The amount of input and generated sequence information a model can directly condition on in one invocation.

  - id: in-context-learning
    label: In-context learning
    kind: learning_paradigm
    audience_level: 5
    description: Adapting model behavior from instructions or examples in its current context without updating its main parameters.

  - id: retrieval-augmented-generation
    label: Retrieval-augmented generation
    kind: system
    audience_level: 5
    description: A system pattern that retrieves external information and supplies it as context to a generative model.
    acronyms:
      - RAG

  - id: tool-use
    label: Tool use
    kind: system
    audience_level: 4
    description: A model or system's ability to select and invoke external computational capabilities.

  - id: function-calling
    label: Function calling
    kind: system
    audience_level: 5
    description: A structured interface through which a model requests invocation of predefined functions or tools.

  - id: ai-agent
    label: AI agent
    kind: system
    audience_level: 2
    description: A system that uses models and tools to select actions over multiple steps in pursuit of an objective.

  - id: chatbot
    label: Chatbot
    kind: system
    audience_level: 1
    description: An interactive system designed to communicate with users through conversational messages.

  - id: ai-assistant
    label: AI assistant
    kind: system
    audience_level: 2
    description: An interactive AI system designed to help users perform informational, creative, or operational tasks.

  - id: voice-assistant
    label: Voice assistant
    kind: system
    audience_level: 1
    description: An AI assistant designed primarily for spoken interaction rather than text.

  - id: coding-assistant
    label: Coding assistant
    kind: system
    audience_level: 2
    description: A system that helps write, complete, or review source code using a language model.

  - id: hallucination
    label: Hallucination
    kind: property
    audience_level: 1
    description: A generative model's tendency to produce fluent, confident output that is factually incorrect or unsupported by its input.

  - id: open-source-model
    label: Open-source model
    kind: property
    audience_level: 2
    description: A model whose weights, and often its architecture and training details, are released publicly to download, run, and modify, unlike models reachable only through a proprietary API.
    aliases:
      - Open-weight model

  - id: system-prompt
    label: System prompt
    kind: data_concept
    audience_level: 3
    description: An initial instruction given to a language model, separate from user messages, that sets its role, behavior, or constraints for a conversation.

  - id: prompt-injection
    label: Prompt injection
    kind: property
    audience_level: 3
    description: A security vulnerability in which crafted input causes a language model to follow injected instructions instead of, or in addition to, its intended ones.

  - id: jailbreak
    label: Jailbreak
    kind: property
    audience_level: 2
    description: A prompt or technique designed to bypass a language model's safety training and elicit outputs it was trained to refuse.
    aliases:
      - Jailbreaking

  - id: ai-guardrails
    label: AI guardrails
    kind: system
    audience_level: 2
    description: Policies, filters, or technical controls layered around a model to constrain its inputs and outputs to acceptable behavior.

  - id: ai-bias
    label: AI bias
    kind: property
    audience_level: 2
    description: Systematic skew in a model's predictions or outputs that disadvantages particular groups or inputs, typically traceable to training data or design choices.
    aliases:
      - Algorithmic bias

  - id: data-poisoning
    label: Data poisoning
    kind: property
    audience_level: 4
    description: An attack that corrupts a model's training data to degrade its performance or implant hidden, attacker-chosen behavior.

  - id: model-collapse
    label: Model collapse
    kind: property
    audience_level: 3
    description: Degradation in a generative model's quality and diversity that occurs when it is repeatedly trained on data produced by earlier generations of models rather than genuine data.
    introduced: 2023

  - id: interpretability
    label: Interpretability
    kind: property
    audience_level: 4
    description: The degree to which a model's internal workings or decisions can be understood by a human without additional tooling.

  - id: knowledge-graph
    label: Knowledge graph
    kind: data_concept
    audience_level: 3
    description: A structured representation of entities and the relationships between them, often used to store and query factual knowledge.

  - id: multi-agent-system
    label: Multi-agent system
    kind: system
    audience_level: 4
    description: A system composed of multiple interacting AI agents that coordinate, negotiate, or compete to accomplish tasks a single agent could not as effectively.

  - id: autonomous-vehicle
    label: Autonomous vehicle
    kind: system
    audience_level: 1
    description: A vehicle that perceives its environment and controls its own steering, acceleration, and braking with little or no human input.
    aliases:
      - Self-driving car

  - id: digital-twin
    label: Digital twin
    kind: system
    audience_level: 3
    description: A virtual model of a physical object, process, or system that is kept synchronized with its real-world counterpart for simulation, monitoring, or prediction.
