schema_version: 1
fragment_type: concepts

concepts:
  - id: training
    label: Training
    kind: training_method
    audience_level: 2
    description: The process of adjusting model parameters using data, experience, and an objective.

  - id: pretraining
    label: Pretraining
    kind: training_method
    audience_level: 4
    description: Training a model on broad data before adaptation or application to downstream tasks.

  - id: fine-tuning
    label: Fine-tuning
    kind: training_method
    audience_level: 3
    description: Continuing training of a pretrained model to adapt it to a domain, task, or behavior.

  - id: supervised-fine-tuning
    label: Supervised fine-tuning
    kind: training_method
    audience_level: 5
    description: Fine-tuning a pretrained model using examples paired with desired outputs.
    acronyms:
      - SFT

  - id: instruction-tuning
    label: Instruction tuning
    kind: training_method
    audience_level: 4
    description: Fine-tuning a model on examples of instructions and desired responses.

  - id: parameter-efficient-fine-tuning
    label: Parameter-efficient fine-tuning
    kind: training_method
    audience_level: 5
    description: Adapting a pretrained model while updating only a small fraction of parameters or added components.
    acronyms:
      - PEFT

  - id: reinforcement-learning-from-human-feedback
    label: Reinforcement learning from human feedback
    kind: training_method
    audience_level: 3
    description: Adapting a model or policy using reinforcement-learning signals derived from human preferences or evaluations.
    acronyms:
      - RLHF

  - id: reinforcement-learning-from-ai-feedback
    label: Reinforcement learning from AI feedback
    kind: training_method
    audience_level: 5
    description: Adapting a model or policy using reinforcement-learning signals derived substantially from evaluations by AI systems.
    acronyms:
      - RLAIF

  - id: preference-optimization
    label: Preference optimization
    kind: training_method
    audience_level: 5
    description: Training a model to favor preferred outputs using comparison or preference data.

  - id: knowledge-distillation
    label: Knowledge distillation
    kind: training_method
    audience_level: 4
    description: Training a model to reproduce selected behavior or representations of another model.

  - id: quantization
    label: Quantization
    kind: training_method
    audience_level: 4
    description: Representing model parameters or computations with reduced numerical precision.

  - id: pruning
    label: Pruning
    kind: training_method
    audience_level: 5
    description: Removing selected parameters, connections, or components from a trained model.

  - id: inference
    label: Inference
    kind: training_method
    audience_level: 4
    description: Applying a trained model to inputs without performing its main parameter-training process.

  - id: loss-function
    label: Loss function
    kind: mathematical_object
    audience_level: 4
    description: A function assigning a numerical penalty to predictions, model states, or parameter choices.

  - id: objective-function
    label: Objective function
    kind: mathematical_object
    audience_level: 5
    description: A scalar function that an optimization procedure attempts to minimize or maximize.

  - id: likelihood
    label: Likelihood
    kind: mathematical_object
    audience_level: 5
    description: A model's probability or density for observed data, regarded as a function of model parameters.

  - id: maximum-likelihood-estimation
    label: Maximum-likelihood estimation
    kind: training_method
    audience_level: 5
    description: Estimating parameters by maximizing the likelihood assigned to observed data.
    acronyms:
      - MLE

  - id: gradient-descent
    label: Gradient descent
    kind: training_method
    audience_level: 4
    description: An iterative optimization method that moves parameters opposite the gradient of an objective.

  - id: stochastic-gradient-descent
    label: Stochastic gradient descent
    kind: training_method
    audience_level: 5
    description: Gradient-based optimization using individual samples or minibatches to estimate an objective gradient.
    acronyms:
      - SGD

  - id: backpropagation
    label: Backpropagation
    kind: training_method
    audience_level: 3
    description: An efficient reverse-mode procedure for differentiating a composed computational graph.

  - id: optimizer
    label: Optimizer
    kind: training_method
    audience_level: 5
    description: An algorithm that updates model parameters to improve an objective.

  - id: regularization
    label: Regularization
    kind: training_method
    audience_level: 5
    description: A constraint, penalty, or procedure intended to improve generalization or encode preferences among solutions.

  - id: parameter
    label: Parameter
    kind: mathematical_object
    audience_level: 2
    description: A model quantity estimated or adjusted during training.

  - id: hyperparameter
    label: Hyperparameter
    kind: mathematical_object
    audience_level: 5
    description: A configuration value controlling a model or learning procedure rather than being learned directly by that procedure.

  - id: dataset
    label: Dataset
    kind: data_concept
    audience_level: 2
    description: A collection of observations or examples used for analysis, training, or evaluation.

  - id: training-set
    label: Training set
    kind: data_concept
    audience_level: 4
    description: The portion of a dataset used to estimate or update model parameters.

  - id: validation-set
    label: Validation set
    kind: data_concept
    audience_level: 5
    description: Data used to guide model selection or tuning without being used as the final test set.

  - id: test-set
    label: Test set
    kind: data_concept
    audience_level: 4
    description: Held-out data used for final evaluation of a selected modeling procedure.

  - id: training-example
    label: Training example
    kind: data_concept
    audience_level: 5
    description: An individual observation or structured unit presented during model training.

  - id: feature
    label: Feature
    kind: data_concept
    audience_level: 4
    description: A measured, constructed, or learned variable supplied to a model.

  - id: label
    label: Label
    kind: data_concept
    audience_level: 3
    description: A categorical target or annotation associated with an example.

  - id: target
    label: Target
    kind: data_concept
    audience_level: 5
    description: A value or structure that a supervised model is trained to predict; a categorical target is usually called a label.

  - id: token
    label: Token
    kind: data_concept
    audience_level: 2
    description: A discrete unit used to represent text or another tokenized modality.

  - id: vocabulary
    label: Vocabulary
    kind: data_concept
    audience_level: 5
    description: The set of discrete tokens recognized or produced by a model.

  - id: embedding
    label: Embedding
    kind: data_concept
    audience_level: 4
    description: A vector representation intended to encode useful properties or relationships.

  - id: latent-representation
    label: Latent representation
    kind: data_concept
    audience_level: 5
    description: An internal representation whose components are not directly observed in the original data.

  - id: data-augmentation
    label: Data augmentation
    kind: training_method
    audience_level: 5
    description: Constructing modified training examples intended to preserve selected meaning while increasing useful variation.

  - id: synthetic-data
    label: Synthetic data
    kind: data_concept
    audience_level: 3
    description: Artificially generated data intended to resemble or supplement observations from a target setting.

  - id: labeled-data
    label: Labeled data
    kind: data_concept
    audience_level: 4
    description: Data containing externally supplied targets or annotations.

  - id: unlabeled-data
    label: Unlabeled data
    kind: data_concept
    audience_level: 5
    description: Data without externally supplied target labels for the learning task.

  - id: chain-of-thought-prompting
    label: Chain-of-thought prompting
    kind: training_method
    audience_level: 3
    description: Prompting or training a model to produce intermediate reasoning steps before its final output.

  - id: benchmark
    label: Benchmark
    kind: evaluation_concept
    audience_level: 3
    description: A standardized dataset or task suite used to measure and compare model performance.

  - id: accuracy
    label: Accuracy
    kind: evaluation_concept
    audience_level: 2
    description: The proportion of a model's predictions that are correct, evaluated against known outcomes.

  - id: parameter-count
    label: Parameter count
    kind: property
    audience_level: 2
    description: A model's total number of learnable parameters, often cited as a rough indicator of scale.

  - id: mnist
    label: MNIST
    kind: data_concept
    audience_level: 5
    description: A benchmark dataset of 70,000 small grayscale images of handwritten digits, long used as the standard first test for image-classification methods.

  - id: cifar-10
    label: CIFAR-10
    kind: data_concept
    audience_level: 5
    description: A benchmark dataset of 60,000 small color images across ten object categories, widely used to evaluate image-classification methods.

  - id: imagenet
    label: ImageNet
    kind: data_concept
    audience_level: 4
    description: A large benchmark dataset of labeled images spanning thousands of categories; a 2012 breakthrough on its classification challenge is widely credited with launching the current deep-learning era.

  - id: rlvr
    label: RLVR
    kind: training_method
    audience_level: 5
    description: Reinforcement learning in which the reward is computed by automatically verifying correctness (such as passing a test or matching a known answer) rather than by a learned preference or reward model.
    aliases:
      - Reinforcement learning with verifiable rewards

  - id: test-time-compute
    label: Test-time compute
    kind: property
    audience_level: 4
    description: The amount of computation a model spends generating and refining its answer at inference time, as opposed to during training; increasing it is a way to trade inference cost for better answers.
    aliases:
      - Inference-time scaling

  - id: kl-divergence
    label: KL divergence
    kind: mathematical_object
    audience_level: 5
    description: A measure of how much one probability distribution diverges from a second, reference distribution; not a true distance, since it isn't symmetric.
    aliases:
      - Kullback-Leibler divergence

  - id: learning-rate
    label: Learning rate
    kind: mathematical_object
    audience_level: 4
    description: A hyperparameter controlling how large a step an optimizer takes when updating parameters in the direction that reduces the objective.

  - id: cross-validation
    label: Cross-validation
    kind: evaluation_concept
    audience_level: 4
    description: A model-evaluation method that repeatedly splits data into training and held-out folds to estimate how well a model generalizes to unseen data.

  - id: f1-score
    label: F1 score
    kind: evaluation_concept
    audience_level: 5
    description: A classification metric combining precision and recall into a single score via their harmonic mean, useful when the two need to be balanced.

  - id: bias-variance-tradeoff
    label: Bias-variance tradeoff
    kind: property
    audience_level: 4
    description: The tension between a model's error from overly simple assumptions (bias) and its error from excessive sensitivity to the training data (variance); reducing one tends to increase the other.

  - id: overfitting
    label: Overfitting
    kind: property
    audience_level: 3
    description: A model's tendency to fit the training data so closely, including its noise, that it performs worse on new, unseen data.

  - id: underfitting
    label: Underfitting
    kind: property
    audience_level: 4
    description: A model's failure to capture the underlying pattern in the training data, resulting in poor performance on both training and new data.
