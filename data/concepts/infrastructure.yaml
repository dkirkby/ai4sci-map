schema_version: 1
fragment_type: concepts

concepts:
  - id: hardware-accelerator
    label: Hardware accelerator
    kind: infrastructure
    audience_level: 4
    description: Specialized computing hardware designed to speed up specific workloads, such as neural-network training or inference, beyond what a general-purpose processor can achieve.

  - id: gpu
    label: GPU
    kind: infrastructure
    audience_level: 2
    description: A processor built for massively parallel computation, originally for graphics and now the dominant hardware for training and running neural networks; NVIDIA is the leading vendor.
    aliases:
      - Graphics processing unit

  - id: tpu
    label: TPU
    kind: infrastructure
    audience_level: 4
    description: Google's custom-designed chip built specifically for accelerating neural-network training and inference.
    aliases:
      - Tensor processing unit

  - id: npu
    label: NPU
    kind: infrastructure
    audience_level: 3
    description: A processor built into consumer devices specifically to accelerate on-device AI inference with low power consumption.
    aliases:
      - Neural processing unit

  - id: cuda
    label: CUDA
    kind: infrastructure
    audience_level: 4
    description: NVIDIA's proprietary parallel-computing platform and programming interface for running general-purpose computation on its GPUs.

  - id: pytorch
    label: PyTorch
    kind: infrastructure
    audience_level: 4
    description: An open-source machine-learning framework widely used for building and training neural networks, originally developed by Meta.

  - id: tensorflow
    label: TensorFlow
    kind: infrastructure
    audience_level: 4
    description: An open-source machine-learning framework widely used for building and training neural networks, originally developed by Google.

  - id: jax
    label: JAX
    kind: infrastructure
    audience_level: 4
    description: An open-source numerical computing library from Google combining NumPy-like arrays with automatic differentiation and just-in-time compilation, used for high-performance machine learning.
    introduced: 2018

  - id: cloud-computing
    label: Cloud computing
    kind: infrastructure
    audience_level: 1
    description: On-demand delivery of computing power, storage, and other IT resources over the internet from remote data centers, rather than from locally owned hardware.

  - id: data-center
    label: Data center
    kind: infrastructure
    audience_level: 2
    description: A facility housing large numbers of networked servers and specialized hardware, providing the physical computing capacity behind cloud services and large-scale model training and inference.

  - id: vector-database
    label: Vector database
    kind: infrastructure
    audience_level: 4
    description: A database optimized for storing embeddings and retrieving the most similar ones to a query vector.
