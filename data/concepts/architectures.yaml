schema_version: 1
fragment_type: concepts

concepts:
  - id: neural-network
    label: Neural network
    kind: model_class
    description: A parameterized model composed of connected computational units arranged into one or more layers.
    aliases:
      - artificial neural network

  - id: feed-forward-neural-network
    label: Feed-forward neural network
    kind: architecture
    description: A neural network whose computation proceeds through a directed acyclic graph from inputs to outputs.

  - id: multilayer-perceptron
    label: Multilayer perceptron
    kind: architecture
    description: A feed-forward neural network composed primarily of fully connected layers and nonlinear activations.
    acronyms:
      - MLP

  - id: deep-neural-network
    label: Deep neural network
    kind: model_class
    description: A neural network containing multiple successive learned representation layers.
    acronyms:
      - DNN
    attributes:
      deep: always

  - id: convolutional-neural-network
    label: Convolutional neural network
    kind: architecture
    description: A neural-network architecture using learned convolutional filters and shared local parameters.
    acronyms:
      - CNN
    modalities:
      - image
      - video

  - id: recurrent-neural-network
    label: Recurrent neural network
    kind: architecture
    description: A neural-network architecture that reuses state-dependent computations across sequence positions.
    acronyms:
      - RNN
    typical_tasks:
      - sequence-modeling

  - id: long-short-term-memory-network
    label: Long short-term memory network
    kind: architecture
    description: A gated recurrent neural network designed to regulate the storage and flow of information through time.
    acronyms:
      - LSTM
    typical_tasks:
      - sequence-modeling

  - id: transformer
    label: Transformer
    kind: architecture
    description: A neural-network architecture based primarily on attention and position-wise transformations.
    introduced: 2017
    attributes:
      deep: always
    modalities:
      - text
      - image
      - audio
      - video
      - time-series

  - id: encoder-only-transformer
    label: Encoder-only transformer
    kind: architecture
    description: A transformer architecture composed primarily of bidirectional encoder blocks.

  - id: decoder-only-transformer
    label: Decoder-only transformer
    kind: architecture
    description: A transformer architecture composed of causally masked decoder blocks.

  - id: encoder-decoder-transformer
    label: Encoder–decoder transformer
    kind: architecture
    description: A transformer containing an encoder for an input sequence and a decoder that generates an output sequence.

  - id: graph-neural-network
    label: Graph neural network
    kind: architecture
    description: A neural-network architecture that operates on entities and relationships represented as a graph.
    acronyms:
      - GNN
    modalities:
      - graph-data

  - id: attention-mechanism
    label: Attention mechanism
    kind: architecture
    description: A mechanism that computes context-dependent weighted combinations of representations.

  - id: encoder-decoder-architecture
    label: Encoder–decoder architecture
    kind: architecture
    description: An architecture that maps an input into an intermediate representation and then decodes it into an output.

  - id: mixture-of-experts
    label: Mixture-of-experts
    kind: architecture
    description: An architecture that routes each input to a selected subset of specialized component networks.
    acronyms:
      - MoE

