schema_version: 1
fragment_type: concepts

concepts:
  - id: linear-regression
    label: Linear regression
    kind: model_family
    audience_level: 3
    description: A regression model in which the predicted response is linear in the fitted parameters.
    typical_tasks:
      - regression
    modalities:
      - tabular-data

  - id: logistic-regression
    label: Logistic regression
    kind: model_family
    audience_level: 4
    description: A linear probabilistic classifier that models class probabilities through a logistic link.
    typical_tasks:
      - classification
    modalities:
      - tabular-data

  - id: generalized-linear-model
    label: Generalized linear model
    kind: model_family
    audience_level: 5
    description: A family of regression models combining a linear predictor, response distribution, and link function.
    acronyms:
      - GLM
    typical_tasks:
      - regression
      - classification

  - id: nearest-neighbor-model
    label: k-nearest neighbors
    kind: model_family
    audience_level: 4
    description: A nonparametric model that predicts using nearby examples under a chosen distance or similarity measure.
    aliases:
      - Nearest-neighbor model
    acronyms:
      - k-NN
    typical_tasks:
      - classification
      - regression

  - id: decision-tree
    label: Decision tree
    kind: model_family
    audience_level: 3
    description: A model that recursively partitions inputs using a tree of feature-based decisions.
    typical_tasks:
      - classification
      - regression
    modalities:
      - tabular-data

  - id: random-forest
    label: Random forest
    kind: model_family
    audience_level: 4
    description: An ensemble of randomized decision trees whose predictions are aggregated.
    typical_tasks:
      - classification
      - regression
    modalities:
      - tabular-data

  - id: gradient-boosted-trees
    label: Gradient-boosted trees
    kind: model_family
    audience_level: 5
    description: An additive ensemble of decision trees fitted sequentially to reduce an objective function.
    typical_tasks:
      - classification
      - regression
    modalities:
      - tabular-data

  - id: support-vector-machine
    label: Support vector machine
    kind: model_family
    audience_level: 4
    description: A margin-based model that can form linear or kernel-defined decision boundaries.
    acronyms:
      - SVM
    typical_tasks:
      - classification
      - regression
    modalities:
      - tabular-data

  - id: kernel-method
    label: Kernel method
    kind: model_family
    audience_level: 5
    description: A method that operates through pairwise kernel evaluations corresponding to an implicit feature space.

  - id: naive-bayes-classifier
    label: Naive Bayes classifier
    kind: model_family
    audience_level: 4
    description: A probabilistic classifier based on Bayes' rule and conditional-independence assumptions.
    typical_tasks:
      - classification

  - id: gaussian-process
    label: Gaussian process
    kind: model_family
    audience_level: 5
    description: A probabilistic model that places a joint Gaussian distribution over function values.
    acronyms:
      - GP
    typical_tasks:
      - regression
      - classification
      - forecasting

  - id: gaussian-mixture-model
    label: Gaussian mixture model
    kind: model_family
    audience_level: 5
    description: A probabilistic density model representing a distribution as a weighted mixture of Gaussian components.
    acronyms:
      - GMM
    typical_tasks:
      - density-estimation
      - clustering
      - anomaly-detection

  - id: hidden-markov-model
    label: Hidden Markov model
    kind: model_family
    audience_level: 5
    description: A sequential probabilistic model with latent states satisfying a Markov dependence assumption.
    acronyms:
      - HMM
    typical_tasks:
      - sequence-modeling

  - id: bayesian-network
    label: Bayesian network
    kind: model_family
    audience_level: 4
    description: A directed acyclic graph that factorizes a joint probability distribution through conditional dependencies.

  - id: principal-component-analysis
    label: Principal component analysis
    kind: model_family
    audience_level: 4
    description: A linear method that projects data onto directions of decreasing sample variance.
    acronyms:
      - PCA
    typical_tasks:
      - dimensionality-reduction
      - representation-learning

  - id: k-means-clustering
    label: k-means clustering
    kind: model_family
    audience_level: 4
    description: A clustering method that assigns observations to clusters represented by their centroids.
    typical_tasks:
      - clustering
    modalities:
      - tabular-data

  - id: umap
    label: UMAP
    kind: model_family
    audience_level: 5
    description: A dimensionality-reduction method that constructs a low-dimensional representation intended to preserve a dataset's local and global structure.
    aliases:
      - Uniform Manifold Approximation and Projection

  - id: t-sne
    label: t-SNE
    kind: model_family
    audience_level: 4
    description: A dimensionality-reduction method that converts similarities between points into probabilities and arranges them in low dimensions to preserve local neighborhoods, for visualizing high-dimensional data.
    aliases:
      - t-distributed stochastic neighbor embedding

  - id: collaborative-filtering
    label: Collaborative filtering
    kind: model_family
    audience_level: 4
    description: A recommendation technique that predicts a user's preferences from the preferences of similar users or the similarity between items, without needing content features.
